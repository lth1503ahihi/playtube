name: Build PlayTube APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build Rust DSP Core
        run: |
          cargo install cargo-ndk
          NDK_DIR=$(find ${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          echo "Using NDK: $NDK_DIR"
          export ANDROID_NDK_HOME="$NDK_DIR"
          mkdir -p mobile/src/stmobile/jniLibs
          cd native/playtube-core
          cargo ndk --platform 24 -t arm64-v8a -o ../../mobile/src/stmobile/jniLibs build --release
          cd ../..
          ls -lh mobile/src/stmobile/jniLibs/arm64-v8a/

      - name: Build PlayTube Debug
        run: |
          chmod +x gradlew
          ./gradlew :mobile:assembleStmobileDebug

      - name: Collect ARM64 APK
        run: |
          mkdir -p dist
          find mobile/build/outputs/ -name "*arm64-v8a*.apk" -exec cp {} dist/PlayTube_arm64-v8a.apk \;
          APK_SIZE=$(stat -c%s dist/PlayTube_arm64-v8a.apk)
          python3 -c "
          import json
          with open('playtube.json', 'r') as f:
              data = json.load(f)
          data['package']['downloadSize_arm64-v8a'] = $APK_SIZE
          data['package']['downloadSize'] = $APK_SIZE
          data['package']['downloadUrlList_arm64-v8a'] = ['https://github.com/lth1503ahihi/playtube/releases/download/v1.0.${{ github.run_number }}/PlayTube_arm64-v8a.apk']
          data['package']['downloadUrlList'] = ['https://github.com/lth1503ahihi/playtube/releases/download/v1.0.${{ github.run_number }}/PlayTube_arm64-v8a.apk']
          with open('dist/playtube.json', 'w') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          "
          ls -lh dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayTube-arm64
          path: dist/PlayTube_arm64-v8a.apk

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" dist/PlayTube_arm64-v8a.apk dist/playtube.json \
            --title "PlayTube $TAG" \
            --notes ""
