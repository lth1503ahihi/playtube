name: Build PlayTube APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Build Rust Native Core (32-bit & 64-bit ARM)
        run: |
          cargo install cargo-ndk
          NDK_DIR=$(find ${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          echo "Using NDK: $NDK_DIR"
          export ANDROID_NDK_HOME="$NDK_DIR"
          mkdir -p mobile/src/stmobile/jniLibs
          cd native/playtube-core
          cargo ndk --platform 21 -t arm64-v8a -t armeabi-v7a -o ../../mobile/src/stmobile/jniLibs build --release
          cd ../..
          ls -lh mobile/src/stmobile/jniLibs/arm64-v8a/
          ls -lh mobile/src/stmobile/jniLibs/armeabi-v7a/

      - name: Configure Permanent Signing Keystore
        env:
          PLAYTUBE_KEYSTORE_B64: ${{ secrets.PLAYTUBE_KEYSTORE_B64 }}
          PLAYTUBE_STORE_PASS: ${{ secrets.PLAYTUBE_STORE_PASS }}
          PLAYTUBE_KEY_ALIAS: ${{ secrets.PLAYTUBE_KEY_ALIAS }}
          PLAYTUBE_KEY_PASS: ${{ secrets.PLAYTUBE_KEY_PASS }}
        run: |
          echo "$PLAYTUBE_KEYSTORE_B64" | base64 -d > playtube-release.jks
          cat <<EOF > keystore.properties
          storeFile=../playtube-release.jks
          storePassword=$PLAYTUBE_STORE_PASS
          keyAlias=$PLAYTUBE_KEY_ALIAS
          keyPassword=$PLAYTUBE_KEY_PASS
          EOF

      - name: Build PlayTube Release (Splits & Universal)
        run: |
          chmod +x gradlew
          ./gradlew :mobile:assembleStmobileRelease -PexcludeFixture=true

      - name: Collect APKs (32-bit, 64-bit & Universal)
        run: |
          mkdir -p dist
          find mobile/build/outputs/ -name "*arm64-v8a*.apk" -exec cp {} dist/PlayTube_arm64-v8a.apk \;
          find mobile/build/outputs/ -name "*armeabi-v7a*.apk" -exec cp {} dist/PlayTube_armeabi-v7a.apk \;
          find mobile/build/outputs/ -name "*universal*.apk" -exec cp {} dist/PlayTube_universal.apk \;
          
          python3 -c "
          import json, os

          with open('playtube.json', 'r') as f:
              data = json.load(f)

          tag = 'v1.0.${{ github.run_number }}'
          base_url = f'https://github.com/lth1503ahihi/playtube/releases/download/{tag}'

          # 64-bit ARM
          if os.path.exists('dist/PlayTube_arm64-v8a.apk'):
              s64 = os.path.getsize('dist/PlayTube_arm64-v8a.apk')
              data['package']['downloadSize_arm64-v8a'] = s64
              data['package']['downloadUrlList_arm64-v8a'] = [f'{base_url}/PlayTube_arm64-v8a.apk']

          # 32-bit ARM
          if os.path.exists('dist/PlayTube_armeabi-v7a.apk'):
              s32 = os.path.getsize('dist/PlayTube_armeabi-v7a.apk')
              data['package']['downloadSize_armeabi-v7a'] = s32
              data['package']['downloadUrlList_armeabi-v7a'] = [f'{base_url}/PlayTube_armeabi-v7a.apk']

          # Universal fallback
          if os.path.exists('dist/PlayTube_universal.apk'):
              su = os.path.getsize('dist/PlayTube_universal.apk')
              data['package']['downloadSize'] = su
              data['package']['downloadUrlList'] = [f'{base_url}/PlayTube_universal.apk']
          elif os.path.exists('dist/PlayTube_arm64-v8a.apk'):
              data['package']['downloadSize'] = s64
              data['package']['downloadUrlList'] = [f'{base_url}/PlayTube_arm64-v8a.apk']

          with open('dist/playtube.json', 'w') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          "
          ls -lh dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PlayTube-APKs
          path: dist/

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" dist/*.apk dist/playtube.json \
            --title "PlayTube $TAG" \
            --notes ""
