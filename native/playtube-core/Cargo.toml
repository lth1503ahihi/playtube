[package]
name = "playtube_core"
version = "0.1.0"
edition = "2021"
authors = ["LE THANH HOAN <github.com/lth1503ahihi>"]

[lib]
name = "playtube_core"
crate-type = ["cdylib"]

[dependencies]
jni = { version = "0.21", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
